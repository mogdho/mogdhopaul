    <section aria-labelledby="remove-title">
      <h2 id="remove-title">Updating or removing it</h2>
      <dl class="options options--wide">
        <div><dt>Get a new version</dt><dd>Download it again and unzip it into the same $folder folder, replacing the old files. Then open <strong>chrome://extensions</strong> and click the round reload arrow on $name.</dd></div>
        <div><dt>Remove it</dt><dd>Open <strong>chrome://extensions</strong>, click <strong>Remove</strong> on $name, then delete the $folder folder.</dd></div>
      </dl>
    </section>
