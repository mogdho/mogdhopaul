name: Build site

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "photos/img/**"
      - "skill-icons/**"
      - "mogdhopaul.webp"
      - "mogdhopaul.jpeg"
      - "style.css"
      - "script.js"
      - "templates/**"
      - "scripts/**"
      - "admin/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build pages from content
        run: python -m scripts.build_site

      # If anything is wrong, the job stops here and the live site keeps its last good version.
      - name: Run tests
        run: |
          python -m unittest discover -s tests -t .
          node --test "tests/js/*.test.mjs"

      - name: Publish rebuilt pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Pages already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A index.html about projects photos admin/index.html skill-icons
            git commit -m "chore: rebuild pages"
            git pull --rebase
            git push
          fi
          # Make sure GitHub Pages republishes (a bot push may not trigger it on its own).
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
