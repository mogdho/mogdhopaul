name: Update photos

on:
  schedule:
    - cron: "30 21 * * *"   # 03:30 in Bangladesh
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-photos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Fetch Instagram photos
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python -m scripts.build_photos

      - name: Commit and publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new photos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html photos data
          git commit -m "chore: update instagram photos"
          git push
          # Make sure GitHub Pages rebuilds after a bot push.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
