<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · Mogdho Paul</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <!-- assets: written by scripts/build_site.py -->
  <link rel="stylesheet" href="/style.css?v=09a7e7e45e">
  <link rel="stylesheet" href="/admin/admin.css?v=6a6c278689">
  <script type="importmap">{"imports": {"/admin/core.js": "/admin/core.js?v=fc1811baa1", "/admin/github.js": "/admin/github.js?v=ea0fc4bae2", "/admin/images.js": "/admin/images.js?v=71553091b0"}}</script>
  <script type="module" src="/admin/app.js?v=3fffb7f2b3"></script>
  <!-- /assets -->
</head>
<body class="admin">
  <div class="cover admin-bar">
    <div class="page admin-bar__inner">
      <p class="admin-bar__title">Mogdho Paul · Admin</p>
      <p class="admin-bar__user" id="user" hidden>Logged in · <button type="button" class="link-button" id="logout">Log out</button></p>
    </div>
  </div>

  <p class="demo-banner" id="demo-banner" hidden>Demo — nothing is saved.</p>

  <main class="page admin-main">
    <section id="login" class="login" hidden>
      <h1>Log in</h1>
      <p>Paste your GitHub key. This device will remember it until you log out.</p>
      <form id="login-form" class="field-stack">
        <label class="field">
          <span class="field__label">GitHub key</span>
          <input type="password" id="token" autocomplete="off" spellcheck="false" required>
        </label>
        <p class="field__error" id="login-error" role="alert"></p>
        <button type="submit" class="button">Log in</button>
      </form>
      <p class="muted">Don't have a key yet? Follow the steps in
        <a href="https://github.com/mogdho/mogdhopaul/blob/main/docs/admin-guide.md">the admin guide</a>.</p>
    </section>

    <p id="loading" class="muted" hidden>Loading your site…</p>

    <div id="editor" hidden>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button type="button" role="tab" id="tab-photos" aria-controls="panel-photos" aria-selected="true">Photos</button>
        <button type="button" role="tab" id="tab-projects" aria-controls="panel-projects" aria-selected="false">Projects</button>
        <button type="button" role="tab" id="tab-text" aria-controls="panel-text" aria-selected="false">Text &amp; links</button>
      </nav>
      <section role="tabpanel" id="panel-photos" aria-labelledby="tab-photos"></section>
      <section role="tabpanel" id="panel-projects" aria-labelledby="tab-projects" hidden></section>
      <section role="tabpanel" id="panel-text" aria-labelledby="tab-text" hidden></section>
    </div>
  </main>

  <div class="save-bar" id="save-bar" hidden>
    <div class="page save-bar__inner">
      <p class="save-bar__status" id="status" role="status" aria-live="polite">No changes yet.</p>
      <button type="button" class="button button--on-cover" id="save" disabled>Save and publish</button>
    </div>
  </div>
</body>
</html>
